<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 점메추</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --text:#2a2622;
    --sub-text:#6b6258; --line:#e8e2d8; --accent:#c9762c; --accent-soft:#f3e2cf;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  [data-weather="hot"]{ --accent:#1f8a82; --accent-soft:#d9efec; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1c1a17; --card:#262320; --text:#efe9e0; --sub-text:#a89e91; --line:#3a352f; --accent-soft:#3a2c1c; }
    [data-weather="hot"]:not([data-theme="light"]){ --accent-soft:#173634; }
  }
  :root[data-theme="dark"]{ --bg:#1c1a17; --card:#262320; --text:#efe9e0; --sub-text:#a89e91; --line:#3a352f; --accent-soft:#3a2c1c; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.5;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 18px 48px;}
  .banner{background:var(--accent-soft); border-radius:14px; padding:10px 14px; font-size:12.5px; color:var(--sub-text); margin-bottom:14px;}
  .status{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 20px; margin-bottom:14px;}
  .status-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0;}
  .status-label{font-size:13px; color:var(--sub-text);}
  .status-value{font-size:15px; font-weight:600;}
  .weather-emoji{font-size:20px; margin-right:4px;}
  .cond-card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 20px; margin-bottom:14px;}
  .cond-summary{display:flex; flex-wrap:wrap; gap:8px;}
  .cond-chip{font-size:12.5px; background:var(--accent-soft); padding:6px 10px; border-radius:999px;}
  .toggle-btn{width:100%; margin-top:12px; padding:10px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer;}
  .settings-body.hidden{display:none;}
  .settings-body{margin-top:14px;}
  .settings-label{font-size:13px; color:var(--sub-text); margin-bottom:6px; display:block;}
  .select-row{display:flex; gap:8px; margin-bottom:12px;}
  select{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px;}
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .chip{flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:13.5px; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cta{width:100%; padding:20px; margin-top:2px; border:none; border-radius:18px; background:var(--accent); color:#fff; font-size:19px; font-weight:700; cursor:pointer; transition:transform .12s ease, opacity .12s ease;}
  .cta:active{transform:scale(0.98);}
  .cta:disabled{opacity:.55; cursor:default;}
  .cta:focus-visible, .icon-link:focus-visible, .retry:focus-visible, select:focus-visible, .chip:focus-visible, .toggle-btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .section-title{font-size:15px; font-weight:700; margin:20px 0 4px;}
  .result-card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; margin-top:14px; animation:rise .25s ease;}
  @media (prefers-reduced-motion: reduce){ .result-card{animation:none;} }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .r-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .r-name{font-size:18px; font-weight:700;}
  .mode-badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle;}
  .mode-badge.stable{background:var(--accent-soft); color:var(--text);}
  .mode-badge.new{background:var(--accent); color:#fff;}
  .r-eta{font-size:13px; color:var(--accent); font-weight:700; white-space:nowrap;}
  .r-category{font-size:14px; color:var(--sub-text); margin-top:2px;}
  .r-address{font-size:12.5px; color:var(--sub-text); margin-top:4px;}
  .r-ratings{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .badge{font-size:12.5px; background:var(--accent-soft); color:var(--text); padding:4px 10px; border-radius:999px;}
  .badge.warn{background:transparent; border:1px solid var(--line);}
  .r-reason{font-size:13.5px; color:var(--sub-text); margin-top:12px; line-height:1.55; border-top:1px solid var(--line); padding-top:10px;}
  .r-links{display:flex; gap:8px; margin-top:12px;}
  .icon-link{flex:1; text-align:center; padding:10px; border-radius:12px; text-decoration:none; font-size:13.5px; font-weight:600; border:1px solid var(--line); color:var(--text);}
  .icon-link.disabled{opacity:.45; pointer-events:none;}
  .result-actions{display:flex; gap:8px; margin-top:16px;}
  .retry{flex:1; padding:14px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:15px; font-weight:600; cursor:pointer;}
  .reset{flex:0 0 auto; padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--sub-text); font-size:14px; cursor:pointer;}
  .empty-note{font-size:12.5px; color:var(--sub-text); text-align:center; margin-top:10px;}
  .footer-note{margin-top:28px; font-size:12px; color:var(--sub-text); text-align:center;}
  .debug-details{margin-top:10px; font-size:12px;}
  .debug-details summary{cursor:pointer; color:var(--sub-text);}
  .debug-line{display:flex; justify-content:space-between; padding:2px 0; color:var(--sub-text);}
  .debug-total{font-weight:700; color:var(--text); border-top:1px solid var(--line); margin-top:4px; padding-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner">🧪 DEMO 모드로 시작 중입니다...</div>

  <div class="status">
    <div class="status-row"><span class="status-label">📍 현재 위치</span><span class="status-value" id="locText">확인 중...</span></div>
    <div class="status-row"><span class="status-label">날씨</span><span class="status-value" id="weatherText"><span class="weather-emoji">⏳</span>불러오는 중</span></div>
  </div>

  <div class="cond-card">
    <div class="cond-summary" id="condSummary"></div>
    <button class="toggle-btn" id="toggleBtn">조건 변경 ▾</button>
    <div class="settings-body hidden" id="settingsBody">
      <span class="settings-label">이동수단 · 최대 이동시간</span>
      <div class="select-row"><select id="modeSelect"></select><select id="timeSelect"></select></div>
      <span class="settings-label">가격대 · 추천 목적</span>
      <div class="select-row"><select id="priceSelect"></select><select id="purposeSelect"></select></div>
      <span class="settings-label">음식 종류</span>
      <div class="chip-row" id="categoryChips"></div>
    </div>
  </div>

  <button class="cta" id="ctaBtn" disabled>위치 확인 중...</button>

  <div id="resultArea"></div>

  <div class="footer-note">식당명·주소는 카카오 Local API 검색 결과이며, 평점·리뷰수 등 제공되지 않는 정보는 별도로 추정하지 않습니다</div>
</div>

<script>
/* ============================================================
   CONFIG — 사용자 설정 기본값 + 알고리즘 가중치 (여기만 바꾸면 튜닝 가능)
   ============================================================ */
const TRAVEL_MODES = { car:{label:'자동차', speedKmh:25}, walk:{label:'도보', speedKmh:4.5} };
const TIME_OPTIONS = [10,20,30,40,60];
const PRICE_OPTIONS = [
  {value:10000, label:'10,000원 이하'}, {value:15000, label:'15,000원 이하'},
  {value:20000, label:'20,000원 이하'}, {value:30000, label:'30,000원 이하'},
  {value:null,  label:'가격 무관'}
];
const PURPOSE_OPTIONS = [
  {key:'default', label:'기본 · 실패 방지'}, {key:'explore', label:'새로운 식당 발굴'},
  {key:'value',   label:'가성비'},           {key:'time',    label:'시간 우선'},
  {key:'taste',   label:'맛 · 검증도 우선'}
];
const FOOD_CATEGORIES = ['전체','한식','중식','일식','양식','분식','국밥','찌개/전골','고기','면','돈까스','초밥/회','카페/브런치','기타'];

// 'demo' = 기존 가짜 18곳 데이터, 'kakao' = 카카오 Local API 실제 검색. 여기서만 바꾸면 됨.
const DATA_SOURCE = 'kakao';
const KAKAO_CONFIG = {
  // 실제 키는 Vercel 환경변수 KAKAO_REST_API_KEY에서만 사용합니다.
  proxyUrl: '/api/kakao',
  categoryGroupCode: 'FD6',                          // 음식점 카테고리 그룹
  radiusMeters: 20000,                               // 카카오 API 문서상 반경 최대치(20km) — 30분 차량 이동범위를 넉넉히 커버
  pageSize: 15,                                      // 카카오 1페이지 최대 문서 수
  maxPages: 3,                                       // 최대 3페이지까지만 (무한 페이지네이션 방지)
  maxResults: 45
};
// 우리 FOOD_CATEGORIES -> 카카오 키워드 검색어 매핑 (category_group_code만으로는 세부 음식종류 필터링이 안 돼서 키워드 검색을 병행)
const FOOD_CATEGORY_KEYWORD_MAP = {
  '한식':'한식', '중식':'중식', '일식':'일식', '양식':'양식', '분식':'분식',
  '국밥':'국밥', '찌개/전골':'찌개', '고기':'고기', '면':'면요리', '돈까스':'돈까스',
  '초밥/회':'초밥', '카페/브런치':'브런치', '기타':''
};
const DEFAULT_SETTINGS = { mode:'car', maxMinutes:30, category:'전체', priceLimit:15000, purpose:'default' };

// 안정형/탐색형 비율 & 분류 기준
const EXPLORATION_CONFIG = { ratio:0.4, stableTrustThreshold:65, explorePurposeAlways:true, balanceWindow:10, balanceStrength:0.8 };
const EXPLORATION_WEIGHTS = { noveltyBonus:8, sameFoodGroupAsRecentBonus:2, qualityFloor:30 };

// 최근 음식 회피 — 완전 동일 메뉴 / 같은 음식군(예: 돈육탕류) / 중식처럼 카테고리 전체
const MENU_REPEAT_CONFIG = {
  avoidanceDays:5,
  exactMenuPenalty:1000,          // 완전 동일 메뉴 -> 사실상 제외
  sameFoodGroupPenalty:35,        // 같은 음식군 다른 메뉴 -> 어느 정도 회피(감점)
  categoryScopeFoodTypes:['중식'],// 이 foodType은 세부 메뉴 안 따지고 통째로 회피
  categoryScopePenalty:1000
};

// 신뢰도(유명맛집) 계산 — 리뷰수는 로그 방식으로 diminishing returns 적용
const TRUST_CONFIG = {
  reviewCountCap:3000, blogCountCap:200, youtubeCountCap:50,
  weights:{ rating:0.45, reviewCount:0.25, blog:0.15, youtube:0.15 }, // 합=1
  verifiedCriteria:{ minReviewCount:700, minRating:4.3 }
};
// 개인 방문평가가 일반 신뢰도를 얼마나 덮어쓸지 — 방문 횟수가 쌓일수록 점진적으로 커짐
const PERSONAL_OVERRIDE_BY_VISIT = { 1:0.2, 2:0.3, 3:0.4, 4:0.5, 5:0.5, 6:0.6 }; // 6회 이상은 마지막 값(0.6) 유지
function getPersonalOverrideWeight(visitCount){
  if(!visitCount || visitCount<1) return 0;
  const keys = Object.keys(PERSONAL_OVERRIDE_BY_VISIT).map(Number).sort((a,b)=>a-b);
  let weight = 0;
  for(const k of keys){ if(visitCount>=k) weight = PERSONAL_OVERRIDE_BY_VISIT[k]; }
  return weight;
}

const FLEXIBLE_PRICE_FOODTYPES = []; // foodType 단위 예외는 안 쓰고, 식당별 priceFlexible 플래그로 처리

// 최종 점수 = 아래 가중치의 가중합 (순위 비교용이라 합이 1일 필요는 없지만 맞춰둠)
const BASE_WEIGHTS = { trust:0.35, weather:0.25, distance:0.18, price:0.10, parking:0.05, operating:0.07 };
const PURPOSE_MODIFIERS = {
  default:{}, explore:{},
  value:{ price:1.8, trust:0.8 },
  time:{ distance:1.8, trust:0.8 },
  taste:{ trust:1.5, price:0.6 }
};
const PARKING_SCORE = { own:70, nearbyPublic:55, none:45, unknown:50 };

/* ============================================================
   STATE
   ============================================================ */
const state = {
  userLoc:null, weather:null, settings:{...DEFAULT_SETTINGS}, allRestaurants:[],
  sessionExcludedIds:new Set(),   // 현재 세션에서 "다시 추천" 눌러도 재등장 막기 위한 목록 (초기화 시 비워짐)
  recommendationHistoryIds:new Set(), // 이 앱 실행 중 한 번이라도 추천된 식당 전체 (신규식당 판정용, 초기화해도 안 지워짐)
  menuHistory:[],              // {id,category,foodType,foodGroup,date}
  recommendationModeHistory:[],// 최근 추천이 stable/new 중 뭐였는지 (탐색비율 장기 균형용)
  userProfile:{ favoriteFoodTypes:['국밥','면'], dislikedFoodTypes:['양식'] }, // 데모용 개인 취향(향후 실제 학습으로 대체)
  dataSourceOverride:null, // 위치 실패 시 사용자가 수동으로 'demo'로 전환한 경우 등
  dataSourceStatus:null    // {source, count, error} — 최근 식당 검색 결과 상태(UI 표시용)
};

/* ============================================================
   LOCATION MODULE (실제 GPS 사용 — 이미 진짜 동작)
   ============================================================ */
function getEffectiveDataSource(){ return state.dataSourceOverride || DATA_SOURCE; }

function afterLocationReady(){ initWeather(); loadRestaurants(); }

// 위치를 못 가져왔을 때: REAL(카카오) 모드라면 가짜 좌표를 진짜처럼 쓰지 않고 안내 + 데모 전환 버튼만 제공.
// DEMO 모드라면 기존처럼 데모 좌표로 바로 넘어감(알고리즘 테스트용이라 문제 없음).
function handleLocationUnavailable(reasonText){
  const locText = document.getElementById('locText');
  if(getEffectiveDataSource()==='kakao'){
    state.userLoc = null;
    locText.textContent = `${reasonText} — 카카오 실제 검색을 위해 위치 권한이 필요합니다`;
    renderLocationBlockedNotice();
  } else {
    state.userLoc = {lat:37.2636, lng:127.0286};
    locText.textContent = `${reasonText} (데모 좌표 사용)`;
    afterLocationReady();
  }
}
function renderLocationBlockedNotice(){
  const area = document.getElementById('resultArea');
  area.innerHTML = `<div class="empty-note">위치 정보가 없어 카카오 실제 검색을 실행하지 않았습니다.<br>
    <button class="retry" id="forceDemoBtn" style="margin-top:8px;">데모 데이터로 보기</button></div>`;
  document.getElementById('forceDemoBtn').addEventListener('click', ()=>{
    state.dataSourceOverride = 'demo';
    state.userLoc = {lat:37.2636, lng:127.0286};
    document.getElementById('locText').textContent = '데모 좌표 사용 (REAL 모드 위치 실패 → 수동 전환)';
    afterLocationReady();
  });
}

function initLocation(){
  const locText = document.getElementById('locText');
  if(!navigator.geolocation){ handleLocationUnavailable('위치 미지원'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ state.userLoc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      locText.textContent = `위도 ${state.userLoc.lat.toFixed(3)}, 경도 ${state.userLoc.lng.toFixed(3)} (실제 GPS)`; afterLocationReady(); },
    ()=>{ handleLocationUnavailable('위치 권한 거부됨'); },
    {timeout:6000}
  );
}

/* ============================================================
   WEATHER MODULE — [실제 API 연동 필요 지점]
   claude.ai 게시 화면 자체는 외부 네트워크 요청이 막혀 있어 항상 데모로 동작합니다.
   실시간 전환 방법은 이전 단계에서 드린 weather-proxy.js 참고.
   ============================================================ */
const WEATHER_CONFIG = { mode:'demo', proxyUrl:'', provider:'openweathermap' };

function getWeatherDemo(){
  const conditions = ['맑음','흐림','비','눈'];
  const seed = new Date().getDate();
  const condition = conditions[seed % conditions.length];
  const temp = 2 + (seed*7) % 30;
  return { condition, temp, isRainOrSnow: condition==='비'||condition==='눈', isCold: temp<10, isHot: temp>=28, isClear: condition==='맑음' && temp>=10 && temp<28 };
}
async function fetchWeather(lat, lng){
  if(WEATHER_CONFIG.mode==='live' && WEATHER_CONFIG.proxyUrl){
    try{
      const res = await fetch(`${WEATHER_CONFIG.proxyUrl}?lat=${lat}&lon=${lng}`);
      if(!res.ok) throw new Error('proxy response not ok');
      return { ...(await res.json()), isDemo:false };
    }catch(e){ console.warn('실시간 날씨 연결 실패, 데모로 대체합니다.', e); }
  }
  return { ...getWeatherDemo(), isDemo:true };
}
async function initWeather(){
  state.weather = await fetchWeather(state.userLoc.lat, state.userLoc.lng);
  const emojiMap = {'맑음':'☀️','흐림':'☁️','비':'🌧️','눈':'❄️'};
  const demoTag = state.weather.isDemo ? ' <span style="opacity:.6;font-weight:400;">(데모)</span>' : '';
  document.getElementById('weatherText').innerHTML = `<span class="weather-emoji">${emojiMap[state.weather.condition]}</span>${state.weather.condition} ${state.weather.temp}°C${demoTag}`;
  document.documentElement.setAttribute('data-weather', state.weather.isHot ? 'hot':'default');
}

/* ============================================================
   RESTAURANT DATA MODULE
   restaurant 구조:
   { id,name,category,foodType,foodGroup,tags,address,latitude,longitude,phone,placeUrl,
     distance,travelTime, rating,reviewCount,blogMentionCount,youtubeMentionCount,
     priceRange:'low'|'medium'|'high'|'unknown', priceFlexible,
     parking:{ownParking,nearbyPublicParking,parkingUnknown},
     isOpen:'OPEN'|'CLOSED'|'UNKNOWN', lunchAvailable:true|false|'unknown',
     personal: null | {visitCount,lastVisitDate,userRating,revisitPreference} }
   ============================================================ */
const MOCK_MENU_POOL = [
  {name:'수원 왕갈비 본가',     category:'왕갈비',       foodType:'한식',       foodGroup:'구이류',     tags:['고기','따뜻한'], addr:'경기 수원시 팔달구 향교로 12',
   rating:4.5, rc:1200, blog:60, yt:8,  price:'high',   parking:{ownParking:true, nearbyPublicParking:false, parkingUnknown:false}, isOpen:'OPEN', lunch:true,  personal:null},

function generateMockRestaurants(center){
  return MOCK_MENU_POOL.map((m,i)=>{
    const angle = (i/MOCK_MENU_POOL.length) * 2*Math.PI;
    const dist = 0.5 + (i%5)*1.1;
    const lat = center.lat + (dist/111)*Math.cos(angle);
    const lng = center.lng + (dist/(111*Math.cos(center.lat*Math.PI/180)))*Math.sin(angle);
    return {
      id:'r'+i, name:m.name, category:m.category, foodType:m.foodType, foodGroup:m.foodGroup, tags:m.tags,
      address:m.addr, latitude:lat, longitude:lng, phone:null,
      placeUrl:`https://map.kakao.com/?q=${encodeURIComponent(m.name)}`,
      distance:null, travelTime:null,
      rating:m.rating, reviewCount:m.rc, blogMentionCount:m.blog, youtubeMentionCount:m.yt,
      priceRange:m.price, priceFlexible:!!m.priceFlexible, parking:m.parking,
      isOpen:m.isOpen, lunchAvailable:m.lunch, personal:m.personal
    };
  });
}

/* ============================================================
   KAKAO API MODULE — 카카오 Local API 연동 계층 (추천 알고리즘과 완전히 분리)
   [중요] claude.ai에 게시된 이 화면 자체는 보안 정책상 외부 네트워크 요청이 차단되어 있어,
   여기서는 실제 호출을 시도해도 항상 네트워크 오류로 처리됩니다. 별도 호스팅 + 키 설정이 필요합니다.
   ============================================================ */
async function classifyKakaoError(res){
  if(res){
    let detail = null;
    try { detail = await res.json(); } catch(e) {}
    const code = detail && detail.code != null ? detail.code : null;
    const msg = detail && detail.msg ? detail.msg : null;
    if(res.status===401) return {type:'auth-failed', message:`카카오 API 인증 실패 (HTTP 401)${code!=null?` / code ${code}`:''}${msg?` — ${msg}`:''}`};
    if(res.status===403) return {type:'permission-error', message:`카카오 API 권한 오류 (HTTP 403)${code!=null?` / code ${code}`:''}${msg?` — ${msg}`:''}`};
    if(res.status===429) return {type:'rate-limited', message:`카카오 API 호출 한도 초과 (HTTP 429)${code!=null?` / code ${code}`:''}${msg?` — ${msg}`:''}`};
    if(res.status===400) return {type:'bad-request', message:`카카오 API 요청 오류 (HTTP 400)${code!=null?` / code ${code}`:''}${msg?` — ${msg}`:''}`};
    return {type:'http-error', message:`카카오 API 오류 (HTTP ${res.status})${code!=null?` / code ${code}`:''}${msg?` — ${msg}`:''}`};
  }
  return {type:'network-error', message:'점메추 서버와 통신하지 못했습니다.'};
}

async function fetchKakaoPage(location, filters, page){
  const params = new URLSearchParams({
    x:String(location.lng), y:String(location.lat),
    radius:String(KAKAO_CONFIG.radiusMeters), page:String(page), size:String(KAKAO_CONFIG.pageSize), sort:'distance'
  });
  const keyword = FOOD_CATEGORY_KEYWORD_MAP[filters.category] || '';
  if(keyword) params.set('query', keyword);
  else params.set('category_group_code', KAKAO_CONFIG.categoryGroupCode);
  const endpoint = keyword ? 'keyword' : 'category';
  params.set('endpoint', endpoint);
  const res = await fetch(`${KAKAO_CONFIG.proxyUrl}?${params.toString()}`);
  if(!res.ok) throw await classifyKakaoError(res);
  return res.json();
}

async function fetchRestaurantsFromKakao(location, filters){
  if(!location) throw {type:'no-location', message:'현재 위치가 없어 검색할 수 없습니다.'};
  let all = [];
  try{
    for(let page=1; page<=KAKAO_CONFIG.maxPages; page++){
      const data = await fetchKakaoPage(location, filters, page);
      all = all.concat(data.documents || []);
      if(!data.meta || data.meta.is_end || all.length>=KAKAO_CONFIG.maxResults) break;
    }
  } catch(err){
    if(err && err.type) throw err;
    throw await classifyKakaoError(null);
  }
  if(all.length===0) throw {type:'no-results', message:'주변에서 식당을 찾지 못했습니다.'};
  return all.slice(0, KAKAO_CONFIG.maxResults);
}

function isActualRestaurant(doc){ return doc.category_group_code==='FD6'; } // 카페(CE7) 등 비식당 제외

function guessFoodTypeFromCategory(categoryName){
  // 카카오 category_name은 "음식점 > 한식 > 육류,고기" 형태 — 우리 FOOD_CATEGORIES와 최대한 매칭(추정, 확정 아님)
  const sub = (categoryName||'').split('>').map(s=>s.trim())[1] || '';
  return FOOD_CATEGORIES.find(c=>c!=='전체' && sub.includes(c)) || '기타';
}

// 카카오 원본 데이터를 우리 Restaurant 구조로 변환. 카카오가 안 주는 값은 절대 추측해서 채우지 않고 null/UNKNOWN 유지.
function normalizeRestaurantData(doc){
  const foodType = guessFoodTypeFromCategory(doc.category_name);
  return {
    id: 'kakao_'+doc.id, name: doc.place_name,
    category: doc.category_name ? doc.category_name.split('>').pop().trim() : doc.place_name,
    foodType, foodGroup: foodType, // 카카오만으론 세부 음식군을 구분할 근거가 없어 foodType과 동일하게 둠(단순화, 추정 아님)
    tags: [], // 냉/따뜻함 태그는 카카오가 안 줌 -> 날씨 적합도는 항상 중립(50점)으로 계산됨
    address: doc.road_address_name || doc.address_name || '',
    latitude: parseFloat(doc.y), longitude: parseFloat(doc.x),
    phone: doc.phone || null, placeUrl: doc.place_url || null,
    distance: doc.distance ? +(parseInt(doc.distance,10)/1000).toFixed(2) : null, // 카카오가 주는 "검색 거리"일 뿐, 차량 이동시간 아님
    travelTime: 'UNKNOWN', // 이번 단계에서는 절대 추정하지 않음(다음 단계 길찾기 API 몫)
    rating: null, reviewCount: null, blogMentionCount: null, youtubeMentionCount: null,
    priceRange: 'unknown', priceFlexible: false,
    parking: { ownParking:false, nearbyPublicParking:false, parkingUnknown:true },
    isOpen: 'UNKNOWN', lunchAvailable: 'unknown', personal: null
  };
}

function dedupeRestaurants(list){
  const seen = new Map();
  list.forEach(r=>{
    const key = r.id || `${r.name}_${r.latitude.toFixed(4)}_${r.longitude.toFixed(4)}`;
    if(!seen.has(key)) seen.set(key, r);
  });
  return [...seen.values()];
}

// DEMO/REAL 분기 지점. recommendRestaurants()는 이 함수가 뭘 반환하든 신경 안 씀(완전 분리).
async function searchNearbyRestaurants(location, settings){
  if(getEffectiveDataSource()==='demo'){
    return { restaurants: generateMockRestaurants(location), source:'demo', count:MOCK_MENU_POOL.length, error:null };
  }
  try{
    const rawDocs = await fetchRestaurantsFromKakao(location, settings);
    const restaurants = dedupeRestaurants(rawDocs.filter(isActualRestaurant).map(normalizeRestaurantData));
    return { restaurants, source:'kakao', count:restaurants.length, error:null };
  } catch(err){
    return { restaurants:[], source:'kakao', count:0, error: err && err.type ? err : {type:'unknown', message:String(err)} };
  }
}

}

function loadRestaurants(){
  const btn = document.getElementById('ctaBtn');
  btn.disabled = true; btn.textContent = '주변 식당 불러오는 중...';

    } else {

    }
  });
}

/* ============================================================
   SCORE CALCULATION — 항목별로 완전히 분리된 순수 함수들
   ============================================================ */
function haversineKm(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function enrichWithTravelInfo(r, userLoc, mode){
  const distanceKm = haversineKm(userLoc, {lat:r.latitude, lng:r.longitude});
  const speed = TRAVEL_MODES[mode].speedKmh;
  const travelTime = Math.max(mode==='walk'?2:3, Math.round(distanceKm/speed*60));
  return {...r, distance:+distanceKm.toFixed(2), travelTime};
}

function diminishing(count, cap){ return count<=0 ? 0 : Math.min(100, (Math.log(count+1)/Math.log(cap+1))*100); }

// 신뢰도 = 평점 + 리뷰수(로그, diminishing) + 블로그노출 + 유튜브노출. 인스타/재방문비율은 API로 안정 확보 불가해 제외.
function calculateTrustScore(r){
  const w = TRUST_CONFIG.weights;
  const ratingScore = Number.isFinite(r.rating) ? (r.rating/5)*100 : 50;
  const reviewScore = Number.isFinite(r.reviewCount) ? diminishing(r.reviewCount, TRUST_CONFIG.reviewCountCap) : 50;
  const blogScore = Number.isFinite(r.blogMentionCount) ? diminishing(r.blogMentionCount, TRUST_CONFIG.blogCountCap) : 50;
  const youtubeScore = Number.isFinite(r.youtubeMentionCount) ? diminishing(r.youtubeMentionCount, TRUST_CONFIG.youtubeCountCap) : 50;
  const generalScore = ratingScore*w.rating + reviewScore*w.reviewCount + blogScore*w.blog + youtubeScore*w.youtube;
  const verified = Number.isFinite(r.reviewCount) && Number.isFinite(r.rating) &&
    r.reviewCount>=TRUST_CONFIG.verifiedCriteria.minReviewCount && r.rating>=TRUST_CONFIG.verifiedCriteria.minRating;
  return { generalScore, verified };
}

// 개인화 점수: 직접 남긴 방문평가가 있으면 그걸 최우선, 없으면 좋아하는/싫어하는 음식종류로 소폭 가감
function calculatePersonalPreferenceScore(r, userProfile){
  if(r.personal && r.personal.revisitPreference){
    const score = {again:100, neutral:55, no:5}[r.personal.revisitPreference] ?? 50;
    const weight = getPersonalOverrideWeight(r.personal.visitCount); // 방문 횟수에 따라 0.2~0.6으로 점진 증가
    return { score, hasData:true, weight };
  }
  let score = 50;
  if(userProfile.favoriteFoodTypes.includes(r.foodType)) score += 15;
  if(userProfile.dislikedFoodTypes.includes(r.foodType)) score -= 20;
  return { score:Math.max(0,Math.min(100,score)), hasData:false, weight:0 };
}

function calculateWeatherFit(r, weather){
  if(weather.isCold && r.tags.some(t=>['국물','따뜻한','칼국수'].includes(t))) return {score:78, reason:'cold'};
  if(weather.isHot && r.tags.some(t=>['냉','시원한','냉면','냉모밀','막국수','콩국수'].includes(t))) return {score:78, reason:'hot'};
  return {score:50, reason:null};
}

// 이동시간 점수 — 0~10 매우유리, 10~20 유리, 20~30 약간불리, 30초과 제외(필터 단계에서 처리)
// 검증된(verified) 식당은 20분 이내 페널티를 크게 완화
function calculateTravelScore(r, verified){
  const t = r.travelTime;
  if(verified && t<=20) return 92;
  if(verified && t<=30) return 78;
  if(t<=10) return 95;
  if(t<=20) return 75;
  return 50; // 20~30분
}

function calculatePriceScore(r, priceLimit){
  if(r.priceFlexible) return 75; // 회전초밥/마라탕/샤브샤브류는 대표가로 불리하게 안 함
  if(priceLimit==null) return 65;
  if(r.priceRange==='unknown') return 55; // 모른다고 제외하지 않되 약간 보수적으로
  if(priceLimit<=12000) return r.priceRange==='low' ? 100 : r.priceRange==='medium' ? 55 : 20;
  if(priceLimit<=18000) return r.priceRange==='low' ? 90  : r.priceRange==='medium' ? 80 : 40;
  return r.priceRange==='high' ? 70 : 85;
}

function calculateParkingScore(r){
  const p = r.parking;
  if(p.ownParking) return PARKING_SCORE.own;
  if(p.parkingUnknown) return PARKING_SCORE.unknown;
  if(p.nearbyPublicParking) return PARKING_SCORE.nearbyPublic;
  return PARKING_SCORE.none;
}

// 영업 여부 — OPEN/CLOSED/UNKNOWN, 점심영업 true/false/'unknown'. CLOSED·false는 필터에서 제외되고,
// 여기서는 "확인은 안 됐지만 후보에는 남는" UNKNOWN 상태에 소폭 감점만 준다.
function calculateOperatingStatusScore(r){
  let score = 100;
  if(r.isOpen==='UNKNOWN') score -= 30;
  if(r.lunchAvailable==='unknown') score -= 15;
  return Math.max(0, score);
}

function isWithinDays(date, days){ return (Date.now()-new Date(date).getTime()) < days*86400000; }

// 최근 메뉴 회피: 완전 동일 메뉴/중식처럼 카테고리 전체 -> 사실상 제외(violated:true)
// 같은 음식군(foodGroup) 다른 메뉴 -> 소폭 감점만(violated:false, penalty>0)
function calculateMenuRepeatPenalty(r, history){
  const recent = history.filter(h=>isWithinDays(h.date, MENU_REPEAT_CONFIG.avoidanceDays));
  if(MENU_REPEAT_CONFIG.categoryScopeFoodTypes.includes(r.foodType) && recent.some(h=>h.foodType===r.foodType)){
    return { violated:true, penalty:MENU_REPEAT_CONFIG.categoryScopePenalty, reason:'category' };
  }
  if(recent.some(h=>h.category===r.category)){
    return { violated:true, penalty:MENU_REPEAT_CONFIG.exactMenuPenalty, reason:'exact' };
  }
  if(recent.some(h=>h.foodGroup===r.foodGroup)){
    return { violated:false, penalty:MENU_REPEAT_CONFIG.sameFoodGroupPenalty, reason:'group' };
  }
  return { violated:false, penalty:0, reason:null };
}

// 탐색(신규 발굴) 슬롯 후보 랭킹용 — 기본 점수에 "최근 안 먹어본 음식군"이면 소폭 보너스
function calculateExplorationScore(r, baseTotal, menuHistory){
  const recentGroups = menuHistory.filter(h=>isWithinDays(h.date, MENU_REPEAT_CONFIG.avoidanceDays)).map(h=>h.foodGroup);
  const bonus = recentGroups.includes(r.foodGroup) ? EXPLORATION_WEIGHTS.sameFoodGroupAsRecentBonus : EXPLORATION_WEIGHTS.noveltyBonus;
  return { total: baseTotal + bonus, bonus };
}

function getWeightsForPurpose(purpose){
  const mod = PURPOSE_MODIFIERS[purpose] || {};
  const w = {...BASE_WEIGHTS};
  Object.keys(mod).forEach(k=> w[k] = w[k]*mod[k]);
  return w;
}

// 모든 항목을 종합한 최종 추천 점수. breakdown에 각 항목이 몇 점을 기여했는지 그대로 남겨서
// 디버그 화면에서 "총점 = 신뢰도+날씨+이동시간+가격+주차+영업상태+개인화-메뉴중복" 을 그대로 보여줄 수 있게 함.
function calculateRecommendationScore(r, context){
  const w = getWeightsForPurpose(context.settings.purpose);
  const trust = calculateTrustScore(r);
  const personal = calculatePersonalPreferenceScore(r, context.userProfile);
  const trustFinal = personal.hasData
    ? trust.generalScore*(1-personal.weight) + personal.score*personal.weight
    : trust.generalScore;
  const weatherFit = calculateWeatherFit(r, context.weather);
  const travel = calculateTravelScore(r, trust.verified);
  const price = calculatePriceScore(r, context.settings.priceLimit);
  const parking = calculateParkingScore(r);
  const operating = calculateOperatingStatusScore(r);
  const menuRepeat = calculateMenuRepeatPenalty(r, context.menuHistory);

  const trustContrib = trust.generalScore*w.trust;
  const finalTrustContrib = trustFinal*w.trust;
  const breakdown = {
    trust: trustContrib,
    personal: finalTrustContrib - trustContrib, // 개인화로 인한 증감분만 별도 표시
    weather: weatherFit.score*w.weather,
    travel: travel*w.distance,
    price: price*w.price,
    parking: parking*w.parking,
    operating: operating*w.operating,
    menuRepeat: -menuRepeat.penalty
  };
  const total = Object.values(breakdown).reduce((a,b)=>a+b, 0);
  return { total, trustFinal, trust, personal, weatherFit, travel, price, parking, operating, menuRepeat, breakdown };
}

/* ============================================================
   RECOMMENDATION ALGORITHM
   ============================================================ */
function decideExplorationRound(purpose){
  if(purpose==='explore') return true;
  const target = EXPLORATION_CONFIG.ratio;
  const recent = state.recommendationModeHistory.slice(-EXPLORATION_CONFIG.balanceWindow);
  const currentRatio = recent.length ? recent.filter(m=>m==='exploration').length/recent.length : target;
  const adjustedProb = Math.min(0.9, Math.max(0.1, target + (target-currentRatio)*EXPLORATION_CONFIG.balanceStrength));
  return Math.random() < adjustedProb;
}

// 후보 리스트에서 "총점 1위 + 그것과 음식종류가 다른 차순위" 최대 2곳을 뽑는다.
// 후보가 1개뿐이면 1개만, 0개면 빈 배열 — 없는 걸 억지로 채우지 않는다.
function pickDistinctPair(list){
  const picks = [];
  if(list[0]) picks.push(list[0]);
  if(picks.length){
    const diff = list.find(c=>c.r.foodType!==picks[0].r.foodType);
    if(diff) picks.push(diff); else if(list[1]) picks.push(list[1]);
  }
  return picks;
}

function recommendRestaurants(restaurants, context){
  const { userLoc, settings, sessionExcludedIds, recommendationHistoryIds, menuHistory } = context;
  const effectiveMax = settings.maxMinutes + (context.weather.isClear ? 10 : 0);

  const buildPool = (excluded)=> restaurants
    .filter(r=>r.isOpen!=='CLOSED' && r.lunchAvailable!==false)
    .filter(r=> settings.category==='전체' || r.foodType===settings.category)
    .map(r=>enrichWithTravelInfo(r, userLoc, settings.mode))
    .filter(r=>r.travelTime<=effectiveMax)
    .filter(r=>!excluded.has(r.id))
    .map(r=>({ r, score:calculateRecommendationScore(r, context) }))
    .filter(c=>!c.score.menuRepeat.violated);

  // 후보가 아예 없을 때만 세션 제외 목록을 비우고 다시 계산 (실제 존재하는 식당을 다시 보여주는 것일 뿐, 데이터를 지어내지 않음)
  let pool = buildPool(sessionExcludedIds);
  let recycled = false;
  if(pool.length < 1){ sessionExcludedIds.clear(); recycled = true; pool = buildPool(sessionExcludedIds); }
  pool.sort((a,b)=>b.score.total - a.score.total);

  const stablePool = pool.filter(c=>c.score.trustFinal>=EXPLORATION_CONFIG.stableTrustThreshold);

  const finish = (picks, fallbackReason)=>{
    state.recommendationModeHistory.push(picks.some(p=>p.mode==='new') ? 'exploration' : 'stable');
    return { picks, recycled, fallbackReason };
  };

  // A. 안정형 후보(trustFinal>=65) 자체가 없으면 탐색형 분기를 시도하지 않고,
  //    낮은 신뢰도 식당을 "안정형"으로 포장하지 않는다 — 전체 후보 중 최선을 그대로 보여줌
  if(stablePool.length===0){
    const picks = pickDistinctPair(pool).map(c=>({...c, mode:'stable', displayTotal:c.score.total}));
    return finish(picks, 'no-stable-pool');
  }

  const isExploreRound = decideExplorationRound(settings.purpose);
  if(isExploreRound){
    // 신규 식당 조건: 최소 신뢰도 30, 안정형 기준(65) 미만, 전체 추천 이력에 없음,
    // 현재 세션에서 이미 추천 안 함(=pool 자체가 sessionExcludedIds를 이미 제외했지만 명시적으로 재확인), 메뉴 중복 규칙 통과(=pool이 이미 보장)
    const explorePool = pool
      .filter(c=> c.score.trustFinal>=EXPLORATION_WEIGHTS.qualityFloor && c.score.trustFinal<EXPLORATION_CONFIG.stableTrustThreshold)
      .filter(c=> !recommendationHistoryIds.has(c.r.id))
      .filter(c=> !sessionExcludedIds.has(c.r.id))
      .map(c=>({...c, exploration:calculateExplorationScore(c.r, c.score.total, menuHistory)}))
      .sort((a,b)=>b.exploration.total - a.exploration.total);

    if(explorePool.length>0){
      const stablePick = {...stablePool[0], mode:'stable', displayTotal:stablePool[0].score.total};
      const newCandidate = explorePool.find(c=>c.r.foodType!==stablePool[0].r.foodType) || explorePool[0];
      const newPick = {...newCandidate, mode:'new', displayTotal:newCandidate.exploration.total, explorationBonus:newCandidate.exploration.bonus};
      return finish([stablePick, newPick], null);
    }
    // B. 안정형 후보는 있지만 신규 탐색 후보가 없음 -> 탐색형을 억지로 구성하지 않고 일반 안정형 추천으로 폴백
    const picks = pickDistinctPair(stablePool).map(c=>({...c, mode:'stable', displayTotal:c.score.total}));
    return finish(picks, 'no-new-candidate');
  }

  // 일반 안정형 라운드
  const picks = pickDistinctPair(stablePool).map(c=>({...c, mode:'stable', displayTotal:c.score.total}));
  return finish(picks, null);
}

/* ============================================================
   UI RENDERING
   ============================================================ */
function initSettingsUI(){
  const modeSelect = document.getElementById('modeSelect');
  Object.entries(TRAVEL_MODES).forEach(([key,v])=>{ const o=document.createElement('option'); o.value=key; o.textContent=v.label; if(key===state.settings.mode)o.selected=true; modeSelect.appendChild(o); });
  const timeSelect = document.getElementById('timeSelect');
  TIME_OPTIONS.forEach(min=>{ const o=document.createElement('option'); o.value=min; o.textContent=`편도 ${min}분`; if(min===state.settings.maxMinutes)o.selected=true; timeSelect.appendChild(o); });
  const priceSelect = document.getElementById('priceSelect');
  PRICE_OPTIONS.forEach(p=>{ const o=document.createElement('option'); o.value=p.value??''; o.textContent=p.label; if(p.value===state.settings.priceLimit)o.selected=true; priceSelect.appendChild(o); });
  const purposeSelect = document.getElementById('purposeSelect');
  PURPOSE_OPTIONS.forEach(p=>{ const o=document.createElement('option'); o.value=p.key; o.textContent=p.label; if(p.key===state.settings.purpose)o.selected=true; purposeSelect.appendChild(o); });
  const chipRow = document.getElementById('categoryChips');
  FOOD_CATEGORIES.forEach(cat=>{
    const chip = document.createElement('button'); chip.type='button';
    chip.className = 'chip' + (cat===state.settings.category ? ' active':'');
    chip.textContent = cat;
    chip.addEventListener('click', ()=>{ state.settings.category=cat; [...chipRow.children].forEach(c=>c.classList.remove('active')); chip.classList.add('active'); onSettingsChanged(); });
    chipRow.appendChild(chip);
  });
  modeSelect.addEventListener('change', e=>{ state.settings.mode=e.target.value; onSettingsChanged(); });
  timeSelect.addEventListener('change', e=>{ state.settings.maxMinutes=+e.target.value; onSettingsChanged(); });
  priceSelect.addEventListener('change', e=>{ state.settings.priceLimit = e.target.value===''?null:+e.target.value; onSettingsChanged(); });
  purposeSelect.addEventListener('change', e=>{ state.settings.purpose=e.target.value; onSettingsChanged(); });
  document.getElementById('toggleBtn').addEventListener('click', ()=>{
    const body = document.getElementById('settingsBody'); const btn = document.getElementById('toggleBtn');
    body.classList.toggle('hidden'); btn.textContent = body.classList.contains('hidden') ? '조건 변경 ▾' : '조건 변경 ▴';
  });
}
function renderCondSummary(){
  const p = PRICE_OPTIONS.find(x=>x.value===state.settings.priceLimit);
  const purposeLabel = PURPOSE_OPTIONS.find(x=>x.key===state.settings.purpose).label;
  const chips = [
    `🚗 ${TRAVEL_MODES[state.settings.mode].label} · 편도 ${state.settings.maxMinutes}분`,
    `💰 ${p.label}`, `🍜 ${state.settings.category}`, `🌤️ 오늘 날씨 반영`, `🔎 ${purposeLabel}`
  ];
  document.getElementById('condSummary').innerHTML = chips.map(c=>`<span class="cond-chip">${c}</span>`).join('');
}
function onSettingsChanged(){
  resetSession(); renderCondSummary();
  // REAL 모드는 음식종류(키워드) 조건이 검색 자체에 영향을 주므로 다시 불러옴. DEMO는 고정 18곳이라 재검색 불필요.
  if(getEffectiveDataSource()==='kakao' && state.userLoc) loadRestaurants();
}
function resetSession(){ state.sessionExcludedIds.clear(); state.menuHistory=[]; state.recommendationModeHistory=[]; document.getElementById('resultArea').innerHTML=''; }
function mapLink(r){ return r.placeUrl; }
function directionsLink(r){ return `https://map.kakao.com/link/to/${encodeURIComponent(r.name)},${r.latitude},${r.longitude}`; }
const PRICE_LABELS = {low:'💰 저렴한 편', medium:'💰 보통 가격대', high:'💰 다소 비쌈', unknown:'💰 가격 정보 없음'};
function parkingLabel(p){ return p.ownParking ? '자체 주차장 있음' : p.nearbyPublicParking ? '인근 공영주차장 이용 가능' : p.parkingUnknown ? '주차 정보 없음' : '주차 어려움'; }

function buildReason(r, score, weather, mode){
  const parts = [];
  parts.push(`차량 기준 약 ${r.travelTime}분 거리(${r.distance}km)입니다.`);
  const ratingText = Number.isFinite(r.rating) ? r.rating.toFixed(1) : '미확인';
  const reviewText = Number.isFinite(r.reviewCount) ? `${r.reviewCount.toLocaleString()}건` : '미확인';
  parts.push(`평점 ${ratingText} · 리뷰 ${reviewText}으로 현재 확인 가능한 정보 기준 신뢰도를 반영했어요.`);
  if(score.weatherFit.reason==='cold') parts.push('쌀쌀한 날씨라 따뜻한 메뉴에 가산점을 줬어요.');
  if(score.weatherFit.reason==='hot') parts.push('더운 날이라 시원한 메뉴에 가산점을 줬어요.');
  if(weather.isRainOrSnow) parts.push('비/눈 예보라 이동시간이 짧은 곳을 더 우선했어요.');
  if(r.personal && r.personal.revisitPreference==='again') parts.push('직접 다녀오시고 "또 갈래요"로 남기신 곳이에요.');
  if(score.menuRepeat.reason==='group') parts.push('최근 드신 메뉴와 계열이 비슷해 약간 감점했지만 후보에는 남겼어요.');
  else parts.push(`최근 ${MENU_REPEAT_CONFIG.avoidanceDays}일 내 드신 메뉴와는 겹치지 않아요.`);
  if(mode==='new') parts.push('오늘은 탐색 슬롯이라 아직 추천한 적 없는 곳으로 골랐어요.');
  if(r.isOpen==='UNKNOWN' || r.lunchAvailable==='unknown') parts.push('영업 정보가 확인되지 않아 약간의 감점은 반영했습니다.');
  return parts.join(' ');
}

function renderDebug(r, score, pick){
  const b = score.breakdown;
  const lines = [
    ['신뢰도', b.trust], ['개인화', b.personal], ['날씨 적합도', b.weather], ['이동시간', b.travel],
    ['가격', b.price], ['주차', b.parking], ['영업상태', b.operating], ['메뉴 중복', b.menuRepeat]
  ];
  if(pick.mode==='new') lines.push(['탐색 보정', pick.explorationBonus]);
  return `<details class="debug-details"><summary>점수 상세 보기 (디버그)</summary>
    ${lines.map(([label,val])=>`<div class="debug-line"><span>${label}</span><span>${val>=0?'+':''}${val.toFixed(1)}</span></div>`).join('')}
    <div class="debug-line debug-total"><span>총점</span><span>${pick.displayTotal.toFixed(1)}</span></div>
  </details>`;
}

function renderResults(){
  const context = { userLoc:state.userLoc, weather:state.weather, settings:state.settings, sessionExcludedIds:state.sessionExcludedIds, recommendationHistoryIds:state.recommendationHistoryIds, menuHistory:state.menuHistory, userProfile:state.userProfile };
  const { picks, recycled } = recommendRestaurants(state.allRestaurants, context);
  const now = new Date();
  picks.forEach(p=>{
    state.sessionExcludedIds.add(p.r.id);
    state.recommendationHistoryIds.add(p.r.id); // 전체 추천 이력 — 초기화 버튼으로도 지워지지 않음(진짜 "처음 추천하는 곳"만 신규로 인정하기 위함)
    state.menuHistory.push({id:p.r.id, category:p.r.category, foodType:p.r.foodType, foodGroup:p.r.foodGroup, date:now});
  });

  const area = document.getElementById('resultArea');
  if(picks.length===0){ area.innerHTML = `<div class="empty-note">조건에 맞는 식당을 찾지 못했어요. 조건을 완화해보세요. (데모 데이터 한계)</div>`; return; }

  area.innerHTML = `<div class="section-title">오늘의 점심 추천</div>` + picks.map(p=>{
    const r = p.r, score = p.score;
    return `
    <div class="result-card">
      <div class="r-top"><span class="r-name">${r.name}<span class="mode-badge ${p.mode==='new'?'new':'stable'}">${p.mode==='new'?'신규 발굴':'안정형'}</span></span><span class="r-eta">${TRAVEL_MODES[state.settings.mode].label} 약 ${r.travelTime}분</span></div>
      <div class="r-category">${r.category} · ${r.foodType}</div>
      <div class="r-address">${r.address}</div>
      <div class="r-ratings">
        <span class="badge">★${Number.isFinite(r.rating) ? r.rating.toFixed(1) : '미확인'} (${Number.isFinite(r.reviewCount) ? r.reviewCount.toLocaleString() : '리뷰 미확인'})</span>
        <span class="badge">${PRICE_LABELS[r.priceRange]}</span>
        <span class="badge">${parkingLabel(r.parking)}</span>
        ${r.isOpen==='UNKNOWN' ? '<span class="badge warn">영업여부 미확인</span>' : ''}
        ${r.lunchAvailable==='unknown' ? '<span class="badge warn">점심영업 미확인</span>' : ''}
      </div>
      <div class="r-reason">${buildReason(r, score, state.weather, p.mode)}</div>
      ${renderDebug(r, score, p)}
      <div class="r-links">
        <a class="icon-link ${r.placeUrl?'':'disabled'}" href="${mapLink(r)}" target="_blank" rel="noopener">🗺️ 카카오맵에서 보기</a>
        <a class="icon-link" href="${directionsLink(r)}" target="_blank" rel="noopener">🚗 길찾기</a>
      </div>
    </div>`;
  }).join('') +
    `<div class="result-actions"><button class="retry" id="retryBtn">다시 추천 🔄</button><button class="reset" id="resetBtn">초기화</button></div>` +
    (recycled ? `<div class="empty-note">후보가 부족해 추천 기록을 초기화하고 다시 계산했어요 (데모 데이터 한계)</div>` : '');

  document.getElementById('retryBtn').addEventListener('click', renderResults);
  document.getElementById('resetBtn').addEventListener('click', resetSession);
}

document.getElementById('ctaBtn').addEventListener('click', ()=>{ if(!state.userLoc || !state.allRestaurants.length) return; renderResults(); });

initSettingsUI(); renderCondSummary(); initLocation();
</script>
